[project]
name = "goal-predictor"
version = "0.1.0"
description = "Predict goals a few seconds ahead from broadcast soccer video"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "polars>=1.0",
    "pyarrow>=15",
]

[project.optional-dependencies]
converters = ["kloppy>=3.19"]
# LightGBM baseline without the torch stack the GNNs need (macOS: brew install libomp)
models = ["lightgbm>=4.3", "scikit-learn>=1.4"]
prediction = [
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "torch>=2.3",
]
vision = [
    "torch>=2.3",
    "torchvision>=0.18",
    "ultralytics>=8.2",
    "supervision>=0.21,<0.31",  # ByteTrack is removed in 0.31
    "opencv-python>=4.9",
]
dev = ["pytest>=8", "ruff>=0.5"]

# PyPI's Windows torch is CPU-only; the workstation (RTX 2060) takes the CUDA build
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gamestate*", "vision*", "converters*", "profiles*", "prediction*", "evaluation*", "demo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
